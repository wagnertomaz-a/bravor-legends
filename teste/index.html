<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Bravor Legends</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #050a1c; overflow: hidden; touch-action: none; }
#canvas { display: block; position: absolute; left: 0; top: 0; }
/* LATERAIS: telas mais largas que 16:9 (ex.: iPhone 15 Pro Max deitado) - o jogo fica 16:9 no meio e as sobras
   mostram a arte LARGA da tela aberta (o jogo avisa qual: lateral_web.gd -> window._bl_lateral). Na altura da tela e
   centralizada, o meio da arte fica exatamente atras do jogo e as pontas continuam a cena. Sem arte: fundo escuro. */
#lateral {
	position: fixed; inset: 0; z-index: -1;
	background: #050a1c center / auto 100% no-repeat;
}
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background: #050a1c url("carregando.jpg") center / cover no-repeat;
	visibility: hidden;
}
@media (max-aspect-ratio: 1/1) {
	#status { background-size: 100% auto; background-position: center 38%; }
}
#status::after {
	content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
	background: linear-gradient(to top, rgba(5,10,28,0.92), rgba(5,10,28,0));
}
#carga {
	position: absolute; left: 0; right: 0; bottom: 7%; z-index: 2;
	display: none; flex-direction: column; align-items: center; gap: 12px;
	font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
}
#carga-texto { font-size: clamp(16px, 2.6vw, 26px); font-weight: 700; letter-spacing: 0.08em; text-shadow: 0 2px 6px #000; }
#carga-trilho {
	width: min(60%, 560px); height: 16px; border-radius: 10px;
	background: rgba(0,0,0,0.55); border: 2px solid #b8821f; padding: 2px; box-sizing: content-box;
}
#carga-barra {
	height: 100%; width: 3%; border-radius: 8px;
	background: linear-gradient(to bottom, #ffe08a, #f08a10);
	box-shadow: 0 0 12px rgba(255,170,40,0.7);
	transition: width 0.25s ease-out;
}
/* CELULAR EM PE: o jogo so roda deitado. Este aviso cobre tudo enquanto o aparelho estiver em pe
   (no Android o primeiro toque ja tenta travar a tela deitada; no iPhone o Safari nao deixa travar). */
#girar {
	display: none; position: fixed; inset: 0; z-index: 50;
	background: #050a1c; color: #ffd84a; text-align: center;
	font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
	flex-direction: column; align-items: center; justify-content: center; gap: 22px;
}
#girar .icone {
	width: 70px; height: 116px; border: 5px solid #ffd84a; border-radius: 14px; position: relative;
	animation: girar-anim 1.8s ease-in-out infinite;
}
#girar .icone::after {
	content: ""; position: absolute; left: 50%; bottom: 8px; width: 14px; height: 14px;
	margin-left: -7px; border-radius: 50%; background: #ffd84a;
}
@keyframes girar-anim { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
#girar .titulo { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 2px 6px #000; }
#girar .sub { font-size: 16px; color: #e8ecf5; opacity: 0.85; max-width: 80%; }
@media (orientation: portrait) and (pointer: coarse) {
	#girar { display: flex; }
}
#status-notice {
	display: none; position: absolute; left: 0; right: 0; top: 40%; z-index: 3;
	background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943;
	color: #e0e0e0; font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center;
}
		</style>
		<!-- icones: quem coloca e o proprio Godot (no "head include" logo abaixo). Nao escrever os links aqui:
		     com a variavel da URL eles viravam "index.js.icon.png" (404) e o iPhone salvava sem icone. -->
		<meta name="apple-mobile-web-app-title" content="Bravor Legends">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<link rel="manifest" href="manifest.json">
		<link rel="preload" as="image" href="carregando.jpg">
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<svg width="0" height="0" style="position:absolute">
			<filter id="cor_arena" color-interpolation-filters="sRGB">
				<feComponentTransfer>
					<feFuncR type="linear" slope="0.858" intercept="-0.058"/>
					<feFuncG type="linear" slope="0.928" intercept="-0.075"/>
					<feFuncB type="linear" slope="0.972" intercept="-0.048"/>
				</feComponentTransfer>
			</filter>
		</svg>
		<div id="lateral"></div>
		<canvas id="canvas">
			Seu navegador nao suporta o elemento canvas.
		</canvas>

		<noscript>
			Seu navegador nao suporta JavaScript.
		</noscript>

		<div id="status">
			<div id="carga">
				<div id="carga-texto">CARREGANDO...</div>
				<div id="carga-trilho"><div id="carga-barra"></div></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<div id="girar">
			<div class="icone"></div>
			<div class="titulo">GIRE O CELULAR</div>
			<div class="sub">Bravor Legends so roda na horizontal</div>
		</div>

		<script>
// CELULAR: tela cheia + tela TRAVADA DEITADA no primeiro toque (Android/Chrome deixa; o navegador exige um toque
// do jogador antes). No iPhone o Safari nao permite travar: fica o aviso "GIRE O CELULAR" enquanto estiver em pe.
(function () {
	const celular = window.matchMedia('(pointer: coarse)').matches && ('ontouchstart' in window);
	if (!celular) {
		return;
	}
	function travarDeitado() {
		const el = document.documentElement;
		const so = screen.orientation;
		const tentarTravar = function () {
			if (so && so.lock) {
				so.lock('landscape').catch(function () {});
			}
		};
		if (!document.fullscreenElement && el.requestFullscreen) {
			el.requestFullscreen({ navigationUI: 'hide' }).then(tentarTravar, tentarTravar);
		} else {
			tentarTravar();
		}
	}
	// todo toque tenta de novo (se o jogador sair da tela cheia, o proximo toque volta a travar)
	['touchend', 'click'].forEach(function (ev) {
		window.addEventListener(ev, travarDeitado, { capture: true, passive: true });
	});
}());
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":17185264,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
// a pagina decide o tamanho do jogo: sempre 16:9, centralizado (as sobras mostram o #lateral)
GODOT_CONFIG.canvasResizePolicy = 0;
(function () {
	const cv = document.getElementById('canvas');
	function ajustar() {
		const W = window.innerWidth;
		const H = window.innerHeight;
		let w = W;
		let h = Math.round(W * 9 / 16);
		if (h > H) {
			h = H;
			w = Math.round(H * 16 / 9);
		}
		const dpr = window.devicePixelRatio || 1;
		cv.style.width = w + 'px';
		cv.style.height = h + 'px';
		cv.style.left = Math.round((W - w) / 2) + 'px';
		cv.style.top = Math.round((H - h) / 2) + 'px';
		cv.width = Math.round(w * dpr);
		cv.height = Math.round(h * dpr);
	}
	ajustar();
	window.addEventListener('resize', function () { ajustar(); if (window._bl_lateral_atual) { window._bl_lateral(window._bl_lateral_atual); } });
	window.addEventListener('orientationchange', function () { setTimeout(ajustar, 250); });
	document.addEventListener('fullscreenchange', function () { setTimeout(ajustar, 100); });
	// arte larga de cada tela (o jogo chama window._bl_lateral('<tela>')). E O MESMO arquivo que o jogo usa naquela
	// tela (o jogo mostra so o recorte 16:9 do meio); publicar_site.ps1 copia: tela_menu/cards/arena/selecao.jpg
	const ARTES = { carregando: 'carregando.jpg', menu: 'tela_menu.jpg', cards: 'tela_cards.jpg', arena: 'tela_arena.jpg',
		selecao: 'tela_selecao.jpg', herois: 'tela_selecao.jpg', heroi: 'tela_selecao.jpg' };
	const F = 'rgba(5,10,28,';   // cor FUNDO do jogo (#050a1c)
	// as mesmas camadas que cada tela desenha por cima da arte (em % da altura = igual ao jogo, que e 720 de altura)
	function camadas(nome) {
		switch (nome) {
			case 'carregando':
				return ['linear-gradient(to top, ' + F + '0.92) 0%, ' + F + '0) 30%)'];
			case 'menu':
				return [];   // o escurecimento do menu ja vem na propria imagem (inteira)
			case 'selecao':
				return ['linear-gradient(90deg, rgba(58,141,255,0.10) 50%, rgba(255,74,74,0.10) 50%)'];
			case 'herois':
				return ['linear-gradient(rgba(3,5,15,0.3), rgba(3,5,15,0.3))'];
			case 'heroi': {
				const r = document.getElementById('canvas').getBoundingClientRect();
				const k = r.width / 1280;
				return ['linear-gradient(90deg, ' + F + '0.92) 0px, ' + F + '0.92) ' + r.left + 'px, ' + F + '0) ' + (r.left + 760 * k) + 'px)',
					'linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.18))'];
			}
		}
		return [];
	}
	const lat = document.getElementById('lateral');
	const prontas = {};
	const tamanhos = {};   // arq -> [largura, altura] da imagem
	// a arte fica EXATAMENTE atras do jogo: mesma altura do canvas e o meio dela no meio do canvas (px inteiros
	// calculados aqui, nao "center": evita meio pixel de diferenca que aparecia como uma linha na emenda)
	function encaixe(arq) {
		const r = document.getElementById('canvas').getBoundingClientRect();
		const t = tamanhos[arq] || [16, 9];
		const h = r.height;
		const w = h * t[0] / t[1];
		const x = r.left + (r.width - w) / 2;
		return { tam: w + 'px ' + h + 'px', pos: x + 'px ' + r.top + 'px' };
	}
	function pintar(nome, arq) {
		const cs = camadas(nome);
		const tams = cs.map(function () { return '100% 100%'; });
		const pos = cs.map(function () { return '0 0'; });
		const e = encaixe(arq);
		lat.style.backgroundImage = cs.concat(['url("' + arq + '")']).join(', ');
		lat.style.backgroundSize = tams.concat([e.tam]).join(', ');
		lat.style.backgroundPosition = pos.concat([e.pos]).join(', ');
		lat.style.filter = nome === 'arena' ? 'url(#cor_arena)' : '';
	}
	window._bl_lateral = function (nome) {
		window._bl_lateral_atual = nome;
		if (nome !== 'arena') { lat.style.transform = ''; }
		const arq = ARTES[nome];
		if (!arq || prontas[arq] === false) { lat.style.backgroundImage = 'none'; lat.style.filter = ''; return; }
		if (prontas[arq] === true) { pintar(nome, arq); return; }
		if (prontas[arq] === 'baixando') { return; }
		const im = new Image();
		im.onload = function () { prontas[arq] = true; tamanhos[arq] = [im.naturalWidth, im.naturalHeight]; if (window._bl_lateral_atual === nome) { pintar(nome, arq); } };
		im.onerror = function () { prontas[arq] = false; };
		im.src = arq;
	};
	window._bl_lateral('carregando');
	// baixa TODAS as artes das laterais ja no inicio (enquanto o jogo carrega): a troca de tela fica instantanea
	Object.keys(ARTES).forEach(function (k) {
		const arq = ARTES[k];
		if (prontas[arq] !== undefined) { return; }
		prontas[arq] = 'baixando';
		const im = new Image();
		im.onload = function () {
			prontas[arq] = true; tamanhos[arq] = [im.naturalWidth, im.naturalHeight];
			if (im.decode) { im.decode().catch(function () {}); }
			if (ARTES[window._bl_lateral_atual] === arq) { pintar(window._bl_lateral_atual, arq); }
		};
		im.onerror = function () { prontas[arq] = false; };
		im.src = arq;
		window['_bl_img_' + k] = im;   // guarda a imagem (o navegador mantem decodificada)
	});
	// partida: zoom de abertura (mesma escala e ponto fixo do fundo do jogo) e escurecimento da contagem
	window._bl_arena = function (z, ax, ay, escuro) {
		const r = document.getElementById('canvas').getBoundingClientRect();
		lat.style.transformOrigin = (r.left + ax * r.width) + 'px ' + (r.top + ay * r.height) + 'px';
		lat.style.transform = z > 1.0001 ? ('scale(' + z + ')') : '';
		lat.style.filter = 'url(#cor_arena)' + (escuro > 0 ? (' brightness(' + (1 - escuro) + ')') : '');
	};
}());
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const carga = document.getElementById('carga');
	const cargaTexto = document.getElementById('carga-texto');
	const cargaBarra = document.getElementById('carga-barra');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		carga.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Erro\nEste navegador nao tem recursos necessarios para rodar o jogo:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					// o download vai ate 90%; a tela de carregamento do Godot (tela_carregamento.gd) continua de 90 a 100%
					const p = Math.min(90, Math.round(current * 90 / total));
					cargaBarra.style.width = Math.max(3, p) + '%';
					cargaTexto.textContent = 'CARREGANDO... ' + p + '%';
				} else {
					cargaTexto.textContent = 'CARREGANDO...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
