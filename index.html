<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Bravor Legends</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #050a1c; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background: #050a1c url("carregando.jpg") center / cover no-repeat;
	visibility: hidden;
}
@media (max-aspect-ratio: 1/1) {
	#status { background-size: 100% auto; background-position: center 38%; }
}
#status::after {
	content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
	background: linear-gradient(to top, rgba(5,10,28,0.92), rgba(5,10,28,0));
}
#carga {
	position: absolute; left: 0; right: 0; bottom: 7%; z-index: 2;
	display: none; flex-direction: column; align-items: center; gap: 12px;
	font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
}
#carga-texto { font-size: clamp(16px, 2.6vw, 26px); font-weight: 700; letter-spacing: 0.08em; text-shadow: 0 2px 6px #000; }
#carga-trilho {
	width: min(60%, 560px); height: 16px; border-radius: 10px;
	background: rgba(0,0,0,0.55); border: 2px solid #b8821f; padding: 2px; box-sizing: content-box;
}
#carga-barra {
	height: 100%; width: 3%; border-radius: 8px;
	background: linear-gradient(to bottom, #ffe08a, #f08a10);
	box-shadow: 0 0 12px rgba(255,170,40,0.7);
	transition: width 0.25s ease-out;
}
#status-notice {
	display: none; position: absolute; left: 0; right: 0; top: 40%; z-index: 3;
	background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943;
	color: #e0e0e0; font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.js.icon.png" />
		<link rel="apple-touch-icon" href="index.js.apple-touch-icon.png"/>
		<link rel="preload" as="image" href="carregando.jpg">
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Seu navegador nao suporta o elemento canvas.
		</canvas>

		<noscript>
			Seu navegador nao suporta JavaScript.
		</noscript>

		<div id="status">
			<div id="carga">
				<div id="carga-texto">CARREGANDO...</div>
				<div id="carga-trilho"><div id="carga-barra"></div></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":27293360,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const carga = document.getElementById('carga');
	const cargaTexto = document.getElementById('carga-texto');
	const cargaBarra = document.getElementById('carga-barra');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		carga.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Erro\nEste navegador nao tem recursos necessarios para rodar o jogo:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const p = Math.min(100, Math.round(current * 100 / total));
					cargaBarra.style.width = Math.max(3, p) + '%';
					cargaTexto.textContent = 'CARREGANDO... ' + p + '%';
				} else {
					cargaTexto.textContent = 'CARREGANDO...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
